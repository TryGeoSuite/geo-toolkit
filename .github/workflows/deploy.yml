name: Deploy landing

# Auto-deploys the GeoSuite Open landing to Cloudflare Workers on every push to
# `main`. Manual runs via the Actions tab too.
#
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token scoped "Edit Cloudflare Workers" from the
#                            GeoSuite Cloudflare account.
#   CLOUDFLARE_ACCOUNT_ID  — that account's id.

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'page.js'
      - 'check.js'
      - 'check-page.js'
      - 'preview.js'
      - 'logos/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'TryGeoSuite/geo-toolkit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The AI Readiness Check parsers, score, preview merge and page script.
      # A failure here stops the deploy: the page script is generated from
      # strings, and a syntax error in it would ship a page that does nothing.
      - name: Test
        run: node --test test/*.test.js

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
